name: Validate pre-launch catalogue and planner

on:
  push:
    branches:
      - prelaunch/catalogue-and-workflow-planner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website branch
        uses: actions/checkout@v6
        with:
          path: website

      - name: Check out matching catalogue branch
        uses: actions/checkout@v6
        with:
          repository: ChemIsFree/tools
          ref: prelaunch/catalogue-and-workflow-planner
          path: catalogue

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Build merged catalogue (validation only)
        working-directory: website
        run: python scripts/build_catalogue.py

      - name: Validate catalogue data and provenance
        working-directory: website
        run: python scripts/validate_catalogue.py

      - name: Check JavaScript syntax
        working-directory: website
        run: |
          node --check js/app.js
          node --check js/tool.js
          node --check js/home.js
          node --check js/workflow-planner.js

      - name: Verify planner and navigation assets
        working-directory: website
        run: |
          test -f workflow-planner.html
          test -f about.html
          grep -q 'js/workflow-planner.js' workflow-planner.html
          grep -q 'workflow-planner.html' index.html
          grep -q 'id="catalogue-count-stat"' index.html

      - name: Install browser test dependency
        working-directory: website
        run: npm install --no-save --no-package-lock playwright

      - name: Install Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Start local static server
        working-directory: website
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/chemisfree-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chemisfree-http.log
          exit 1

      - name: Browser smoke test
        working-directory: website
        run: node scripts/smoke_test.mjs

      - name: Capture desktop and mobile visual review
        working-directory: website
        run: node scripts/visual_review.mjs

      - name: Package local preview site
        working-directory: website
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(".")
          output = root / "visual-review" / "chemisfree-prelaunch-preview.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if any(part in {".git", "node_modules", "visual-review"} for part in relative.parts):
                      continue
                  archive.write(path, relative.as_posix())
          print(f"Created {output} ({output.stat().st_size:,} bytes)")
          PY

      - name: Upload screenshots and local preview package
        uses: actions/upload-artifact@v4
        with:
          name: chemisfree-visual-review
          path: website/visual-review/
          if-no-files-found: error
          retention-days: 14
